<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scan Component</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; padding: 15px; background-color: #f4f7fc; color: #333; }
        
        .center-content { padding: 5px; display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
        .mode-row, .action-row { display: flex; gap: 10px; }
        
        .mode-btn { flex: 1; height: 50px; border-radius: 12px; border: 2px solid; font-weight: 700; background: #fff; cursor: pointer; transition: .2s; }
        .pickup { border-color: #2563eb; color: #2563eb; }
        .return { border-color: #14b8a6; color: #14b8a6; }
        .active-pickup { background: #2563eb; color: #fff !important; }
        .active-return { background: #14b8a6; color: #fff !important; }
        
        .scan-panel { display: none; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #e5e7eb; border-radius: 14px; background: #fafcff; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .input { height: 46px; padding: 0 14px; border: 1px solid #dbe2ea; border-radius: 12px; outline: none; background: #fff; font-size: 15px; width: 100%; }
        .input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        
        .btn { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .btn-camera { background: #e0f2fe; color: #0369a1; }
        .btn-manual { background: #f3f4f6; color: #4b5563; }
        .btn-save { background: #2563eb; color: white; flex: 2; }
        .btn-stop { background: #ef4444; color: white; flex: 1; }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; display: none; margin-bottom: 10px; }
        .result-card { display: none; padding: 12px; border-radius: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; font-size: 14px; line-height: 1.5; }
        
        /* Toast style notifications */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="center-content">
        <div class="mode-row">
            <button id="pickupBtn" class="mode-btn pickup" onclick="selectType('Pickup')">🚚 Daily Pickup Scan</button>
            <button id="returnBtn" class="mode-btn return" onclick="selectType('Return')">🔄 Returns Scan</button>
        </div>

        <div id="scanPanel" class="scan-panel">
            <button class="btn btn-camera" onclick="startCamera()">📷 Camera Scan</button>
            <button class="btn btn-manual" onclick="focusAWB()">⌨ Manual / Scanner Mode</button>
            
            <div id="reader"></div>
            
            <input id="awbInput" class="input" placeholder="Scan or Type AWB">
            <input id="orderInput" class="input" placeholder="Order ID (Manual Fallback)" style="display: none;">
            
            <div id="resultCard" class="result-card"></div>
            
            <div class="action-row">
                <button class="btn btn-save" onclick="saveEntry()">Next Scan ➡️</button>
                <button class="btn btn-stop" onclick="stopWork()">Stop Operation</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentType = "";
        let html5QrCode = null;
        let currentTracking = null;
        let scannerBuffer = "";
        const API_URL = "https://script.google.com/macros/s/AKfycbxoWaTIECKCVnljXiqLVIRRC8Orhlcvcih9eqT7J2wjIaJ5j94g97m0KI6A4GSEK2gN/exec"; // Replace with your standard backend URL later
        const beep = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav'); // Default tracking beep audio

        function toast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function selectType(type){
            currentType = type;
            document.getElementById("scanPanel").style.display = "flex";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");

            if(type === "Pickup"){
                document.getElementById("pickupBtn").classList.add("active-pickup");
            } else {
                document.getElementById("returnBtn").classList.add("active-return");
            }
            clearForm();
            focusAWB();
        }

        function clearForm(){
            currentTracking = null;
            document.getElementById("awbInput").value = "";
            document.getElementById("orderInput").value = "";
            document.getElementById("orderInput").style.display = "none";
            document.getElementById("resultCard").style.display = "none";
            document.getElementById("resultCard").innerHTML = "";
        }

        function focusAWB(){
            document.getElementById("awbInput").focus();
        }

        async function startCamera(){
            try{
                if(html5QrCode){ await stopCamera(); }
                document.getElementById("reader").style.display = "block";
                html5QrCode = new Html5Qrcode("reader");

                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 280, height: 140 } },
                    function(decodedText){
                        document.getElementById("awbInput").value = decodedText;
                        try { beep.play(); } catch(e){}
                        stopCamera();
                        trackShipment();
                    }
                );
            } catch(err){
                toast("Camera Initialization Error");
                console.log(err);
            }
        }

        async function stopCamera(){
            try {
                if(html5QrCode){
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                    html5QrCode = null;
                }
            } catch(err){}
            document.getElementById("reader").style.display = "none";
        }

        // Auto trigger input tracking on Enter key press
        document.getElementById("awbInput").addEventListener("keydown", function(e){
            if(e.key === "Enter"){ trackShipment(); }
        });

        // Hardware USB Gun Scanner Auto Processing
        document.addEventListener("keydown", function(e){
            if(document.activeElement.id !== "awbInput"){ return; }
            if(e.key === "Enter"){
                e.preventDefault();
                const awb = scannerBuffer.trim();
                if(awb.length > 5){
                    document.getElementById("awbInput").value = awb;
                    trackShipment();
                }
                scannerBuffer = "";
                return;
            }
            if(e.key.length === 1){ scannerBuffer += e.key; }
        });

        async function trackShipment(){
            const awb = document.getElementById("awbInput").value.trim();
            if(!awb){ toast("Please Scan / Enter AWB"); return; }
            
            toast("Checking AWB Status...");
            
            try {
                // Simulating response for standalone architecture testing. 
                // Swap with actual API URL when server logic is online.
                const response = await fetch(API_URL + "?action=trackShipment&awb=" + encodeURIComponent(awb)).catch(()=>null);
                
                if (response) {
                    const result = await response.json();
                    if(result.success){
                        currentTracking = result;
                        renderTracking(result);
                        return;
                    }
                }
                openManualOrder(); // Fallback if server throws mismatch
            } catch(err){
                openManualOrder();
            }
        }

        function openManualOrder(){
            currentTracking = null;
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            card.style.background = "#fee2e2";
            card.style.borderColor = "#fca5a5";
            card.innerHTML = `<div style="color:#dc2626; font-weight:600;">Tracking Not Found</div>
                              <div style="margin-top:4px;">Enter Order ID manually below.</div>`;
            
            document.getElementById("orderInput").style.style.display = "block";
            document.getElementById("orderInput").focus();
        }

        function renderTracking(data){
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            card.style.background = "#f0fdf4";
            card.style.borderColor = "#bbf7d0";
            card.innerHTML = `
                <b>AWB:</b> ${data.awb || ""}<br>
                <b>Order ID:</b> ${data.orderId || ""}<br>
                <b>Status:</b> ${data.status || ""}<br>
                <b>Courier:</b> ${data.courier || ""}<br>
                <b>Customer:</b> ${data.customerName || ""}
            `;
            document.getElementById("orderInput").value = data.orderId || "";
        }

        function saveEntry() {
            const awb = document.getElementById("awbInput").value.trim();
            if(!awb) { toast("No data to save."); return; }
            toast("Entry Saved Successfully!");
            clearForm();
            focusAWB();
        }

        function stopWork() {
            toast("Operation Stopped.");
            clearForm();
            document.getElementById("scanPanel").style.display = "none";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");
        }
    </script>
</body>
</html>
